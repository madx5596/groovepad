include ':app'

// Flutter Engine
def flutterRoot = rootProject.projectDir.parentFile.absolutePath + '/flutter'
def flutterToolsDir = new File(flutterRoot, 'packages/flutter_tools')

if (flutterToolsDir.exists()) {
    include ':flutter'
    project(':flutter').projectDir = new File(flutterToolsDir, 'gradle/app')
}
