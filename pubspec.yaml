name: groovepad
description: GroovePad - Flutter приложение для воспроизведения лупов с загрузкой собственных аудиосемплов.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  audioplayers: ^5.2.0
  file_picker: ^6.0.0
  permission_handler: ^11.4.4
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
